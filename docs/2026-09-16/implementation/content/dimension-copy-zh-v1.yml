# 四维解释文案（packageId = typeme-jung48-zh-v1，contentStatus = draft_review_pending）
#
# 用途：内容包 `dimensions[]`，供题目页的维度提示、报告页的四维说明、以及"平分"时的解释。
#
# 写作约束（比题目更严，因为这里是**结论性表述**）：
#   1. 两极对等：任何一极都不能被写成优点、另一极被写成缺点。评测结果不是评价。
#   2. 不给能力、道德或健康暗示：不说"更聪明""更成熟""更受欢迎""更健康"。
#   3. `dailySigns` 写**可观察的行为**，不写性格标签。用户要能对照自己的日常认出来。
#   4. `balanced` 是"该维两极得分相抵"时的话，必须说明这不是缺陷，也不是"还没有性格"。
#   5. 不出现准确率/概率/百分位/置信/确诊等词，也不引用 MBTI 官方或 16Personalities。
#
# 四维名称统一为：EI 精力方向、SN 信息取向、TF 决策依据、JP 生活节奏。

dimensions:
  - dimension: "EI"
    name: "精力方向"
    question: "你的精力更多从哪里来"
    negativePole:
      pole: "I"
      label: "偏内"
      description: "你的精力更容易在安静、人少的场合回补。想法通常先在脑子里过一遍，再决定要不要说出口。和熟人待一下午也会开心，但散场之后往往需要一段独处时间才觉得缓过来。人数多、节奏快的场合你能应付，只是持续久了会明显想找个角落。"
      dailySigns:
        - "在人多的场合待久了，会想找个安静的地方待一会儿"
        - "有想法时习惯先自己理一遍，再决定跟谁说"
        - "电话和消息不一定马上回，但不是不在意"
        - "更喜欢一对一的深聊，而不是同时应付很多人"
        - "一个人吃饭、走路、通勤，不太觉得难熬"
    positivePole:
      pole: "E"
      label: "偏外"
      description: "你的精力更容易在有人互动、有事情发生的场合回补。想法常常边说边成形，说着说着才想清楚自己要表达什么。一个人待久了会觉得闷，想找人说说话或者出门走走。热闹过后不太需要缓，反而可能更有精神。"
      dailySigns:
        - "一个人待久了会觉得闷，想找人聊两句"
        - "讨论时容易边说边想出结论，而不是想好了才开口"
        - "参加完聚会回家，通常不觉得被耗空"
        - "更喜欢和一群人一起做事，而不是独自推进"
        - "遇到事情倾向于先找人说说，而不是先自己消化"
    balanced:
      summary: "这一维你两边差不多，说明你的精力补充方式会随场合、心情和阶段变化。"
      reading: "常见的表现是：有时候很想找人说话，有时候只想安静待着；工作日和周末可能完全不一样。这不代表你「没定性」，而是这一维对你来说本来就比较灵活——你可以按当下需要选更省力的那一边。"
    tiedNotice: "这一维两边一样多，所以不给出这一位的字母。你可以想一下最近一个月里，哪种情况出现得更多。"

  - dimension: "SN"
    name: "信息取向"
    question: "你更信哪一类信息"
    negativePole:
      pole: "S"
      label: "偏实"
      description: "你更容易被具体、能验证的信息说服：做过的例子、实际的数字、具体的做法。听人介绍新东西时，先想知道它到底怎么运作、第一步做什么。对「听起来很好」但说不清细节的说法，你会自然留个心。已经跑通的做法你更愿意沿用，改之前希望先看到证据。"
      dailySigns:
        - "听人介绍新东西，先问具体怎么做、有没有例子"
        - "更信自己亲眼看到或亲手做过的事"
        - "描述一件事时容易讲清时间、地点、经过"
        - "对「大概」「差不多」这类说法会想追问到底是多少"
        - "用过好用的方法，通常不愿意随便换"
    positivePole:
      pole: "N"
      label: "偏想"
      description: "你更容易被整体走向、背后的思路和可能性吸引。听人介绍新东西时，先想知道它整体是怎么回事、各部分怎么连起来。具体细节可以后面再补，先抓住方向更重要。你也善于从一个领域想到另一个领域，把看似无关的事情连起来。"
      dailySigns:
        - "听新东西时先想知道整体思路，细节可以后补"
        - "经常从一个话题跳到另一个相关的话题"
        - "对「以后可能会怎样」比「现在具体如何」更有兴趣"
        - "描述一件事时容易先讲道理和含义，再讲经过"
        - "喜欢琢磨事情背后的原因和走向"
    balanced:
      summary: "这一维你两边差不多，说明你既看具体做法，也在意整体方向。"
      reading: "常见的表现是：听新东西时既想要例子，也想知道整体思路；有时先动手，有时先想清楚。这不是「夹在中间」，而是你有两套都还算顺手的处理方式，可以按任务性质切换。"
    tiedNotice: "这一维两边一样多，所以不给出这一位的字母。你可以回想最近学新东西时，更常从哪一头入手。"

  - dimension: "TF"
    name: "决策依据"
    question: "做取舍时你先看什么"
    negativePole:
      pole: "T"
      label: "偏理"
      description: "做取舍时，你先看标准是否一致、理由站不站得住、结果能不能解释清楚。不是不在意别人的感受，而是倾向于先把事情本身理清，再考虑怎么安置各方的感受。意见不合时，你更愿意对着依据讨论，而不是先安抚情绪。被人指出逻辑漏洞，你通常不会觉得被冒犯。"
      dailySigns:
        - "决定前先看依据和标准，再看各方感受"
        - "被人反驳时先想对方说得对不对，而不是先想关系"
        - "给建议时倾向于直接说哪里不行、怎么改"
        - "觉得「按同一套标准办」比「这次特殊处理」更让人服气"
        - "别人难过时，会先想能帮上什么忙，再考虑要不要陪着待一会儿"
    positivePole:
      pole: "F"
      label: "偏情"
      description: "做取舍时，你先看这件事会落到谁身上、对关系有什么影响、大家的感受如何。不是不看道理，而是倾向于先照顾到人的处境，再把标准往里收。意见不合时，你更在意对方为什么这么在意。给建议时，你会先想怎么说对方才听得进去。"
      dailySigns:
        - "决定前先想这件事对具体的人意味着什么"
        - "被人反驳时先想对方为什么这么在意"
        - "给建议时会先斟酌说法，考虑对方接不接得住"
        - "觉得「这次情况特殊」值得为它开个口子"
        - "别人情绪不好时，很难当作没看见"
    balanced:
      summary: "这一维你两边差不多，说明你既看标准，也在意人的处境。"
      reading: "常见的表现是：有些场合先讲规则，有些场合先照顾人；同一天里也可能不一样。这不是「没原则」或「太软」，而是你会按事情的性质选不同的入口——先理清事实再谈感受，或者先安顿好人的状态再谈标准，都可能有效。"
    tiedNotice: "这一维两边一样多，所以不给出这一位的字母。你可以想一下最近一次为难的取舍，当时先考虑的是什么。"

  - dimension: "JP"
    name: "生活节奏"
    question: "你更习惯哪种推进方式"
    negativePole:
      pole: "J"
      label: "偏定"
      description: "你更舒服的节奏是先定下来再推进：大致顺序、时间点、要交付什么，心里有数才踏实。事情能收尾就先收尾，改来改去会让你有点烦。临时变更你能接受，但希望一次说清、别分成几次。空闲时间也习惯先有个安排，哪怕只是大概。"
      dailySigns:
        - "喜欢先定好顺序和时间，再开始动手"
        - "事情做到差不多能交，就先交出去，细节以后再说"
        - "临时改计划可以接受，但希望一次说清楚"
        - "待办没划掉会一直记着，不太放得下"
        - "出门、过节这类事习惯提前安排"
    positivePole:
      pole: "P"
      label: "偏活"
      description: "你更舒服的节奏是先开始、边做边看：留一点空间，到那时再决定，选项多一点反而自在。事情不必急着收口，还有余地就能接着改。临时变更对你影响不大，甚至觉得更有意思。空闲时间不排满，你也不觉得是浪费。"
      dailySigns:
        - "喜欢先开始，做了再调整，不太想提前全定死"
        - "事情还想再改改，不急着交出去"
        - "计划被临时改掉，通常不太影响状态"
        - "同时开着几件事，也不觉得乱"
        - "空闲时间没安排，反而觉得自在"
    balanced:
      summary: "这一维你两边差不多，说明你既能按计划推进，也能接受边走边看。"
      reading: "常见的表现是：工作里喜欢有个框架，生活里愿意随机一点；或者反过来，看事情重不重要。这不是「没节奏」，而是你在两种推进方式之间切换的成本都不高。"
    tiedNotice: "这一维两边一样多，所以不给出这一位的字母。你可以想一下最近一周是怎么安排时间的，哪种更接近实际。"
