# 四个精神活动过程 + 由它派生的建议文案（processCopyVersion = typeme-process-copy-zh-v1）
#
# 这一层解决的是现有报告缺的那一环：报告原先只按**四字母**取八段通用文案，
# 于是它知道"你是 ISTJ"，却说不出"你的主导过程是内倾感觉、辅助是外倾思考"，
# 也就无法解释"你和 INTJ 差在哪""你该先练哪个""为什么这题你会选错自己"。
#
# 方法论来源：《天资差异：人格分类的理解》
#   （Gifts Differing, Isabel Briggs Myers & Peter B. Myers，张荣建译，重庆出版社 2008）
#   第 1 章 1.9–1.11（辅助过程的两项职责；J/P 决定哪个过程对外使用）——印刷 p.13–17
#   第 2 章（ISTJ / INFP 的辅助过程例证）——印刷 p.21
#   第 8 章与图表 24–31（外倾与内倾的同名过程是不同的东西）
#   第 9 章（16 型描述；9.1"灰色区域"）——印刷 p.78–107
#   第 10 章与图表 32（对立类型的相互补充；给思考型的三条相处技术）——印刷 p.108–114
#   第 19 章（19.2 三层发展要求 → p.179；19.3 四步决策法 → p.182；19.5–19.6 沟通规则 → p.186）
#
# **不是原书摘录**：下列每一句都是本项目按上述方法改写的中文说明，未逐字复制原书文字。
# 其中四步决策法每一步的 `prompt` 是对原书所给问法的**改写**（意译其要点），
# 不是原句照录；`asDominant` / `whenUnpreferred` 一类的描述则完全由本项目撰写。
# 逐条页码依据见 docs/2026-09-16/TypeMe-分析建议方法论-v2.md 附录 A。
# 群体分布与统计表不在这里（本版刻意不引入任何人群比例数据）。
#
# 写作约束：
#   1. 四个过程地位不同，但**没有高下**：主导是"用起来最省力的"，两个尚未偏好的过程是
#      "还没练过的"，不是缺陷，也不是"缺少的能力"。
#   2. 不写绝对说法（总是/从不/一定），不写诊断、道德或能力评价。
#   3. 不出现准确率/概率/百分位/置信/确诊/命中注定等词。
#   4. `offers` 只写"这一侧能提供给对面那一侧的东西"，避免两侧各写一遍导致口径打架。
#
# 过程代号：S/N = 两种感知，T/F = 两种判断；后缀 i/e = 主要朝里用 / 主要朝外使用。

processCopyVersion: "typeme-process-copy-zh-v1"
contentStatus: "draft_review_pending"

processes:
  - process: "Si"
    what: "把眼前发生的事和你记得的、已经验证过的经验放在一起比。它管的是「跟以前比，哪里一样、哪里变了」。"
    asDominant: "你会先确认事情对不对得上，再决定下一步；答应过的事记在心里，习惯用已经走通的做法把事情办成。"
    whenUnpreferred: "这一环还没练过的时候，容易漏掉已经确认过的细节或承诺，也可能因为「以前不是这样」而先抵触新做法。"

  - process: "Se"
    what: "直接看眼前真实存在的东西：环境里现在有什么、正在发生什么。它管的是「事情本身是什么样」。"
    asDominant: "你对当下的人和事反应快，动手做具体的事比听人讲更快上手，倾向于先做起来再调整。"
    whenUnpreferred: "这一环还没练过的时候，可能想得不少却没注意眼前的实际条件，也可能在需要当场处理具体状况时慢半拍。"

  - process: "Ni"
    what: "把零散的信息在心里拼成一张完整的图，指向「这件事往后大概会走到哪里」。它管的是长线的走向。"
    asDominant: "你心里常有一个远期的图景，做事围绕它推进；当下不一定说得清理由，过一段时间往往会被验证。"
    whenUnpreferred: "这一环还没练过的时候，容易只盯着眼前这一步，较难预见几步之后会怎样。"

  - process: "Ne"
    what: "在外部世界里看见多种可能：这件事还能变成什么、和什么有关。它管的是「还有哪些别的路」。"
    asDominant: "新的可能性本身对你就有一股推动力，你喜欢开出新方向，把看起来不相干的东西连起来。"
    whenUnpreferred: "这一环还没练过的时候，可能较早认定只有一种做法，或者对「也许还有别的可能」提不起兴趣。"

  - process: "Ti"
    what: "在自己的逻辑里把一件事拆开、理顺，看它内部讲不讲得通。它管的是「道理自洽不自洽」。"
    asDominant: "你会先自己把逻辑理清再表态；碰到相互矛盾的说法，会想先把定义和前提弄清楚。"
    whenUnpreferred: "这一环还没练过的时候，可能接受一个说法而不去追问它的定义和前提。"

  - process: "Te"
    what: "把逻辑用到外部去组织事情：定标准、分任务、看结果、推进度。它管的是「怎样让事情按计划落地」。"
    asDominant: "你会很快判断可行不可行，习惯把目标拆成步骤，定好由谁在什么时候完成。"
    whenUnpreferred: "这一环还没练过的时候，可能把事情想明白了却推不动，或者较难把标准讲清楚让别人照着做。"

  - process: "Fi"
    what: "在心里判断什么对自己是重要的、可以接受的。它管的是「这件事和我重视的东西是不是一致」。"
    asDominant: "你对自己的价值标准很清楚，不一定说出来，但违背它的要求你很难照做。"
    whenUnpreferred: "这一环还没练过的时候，可能答应了并不认同的事，过一阵才发现心里过不去。"

  - process: "Fe"
    what: "在外部照顾人和人之间的状态：别人的需要、场上的气氛、大家共同认可的东西。它管的是「在一起顺不顺」。"
    asDominant: "你对场上的气氛和他人的需要反应快，习惯把话说得体面，把关系维持在还能继续合作的状态。"
    whenUnpreferred: "这一环还没练过的时候，可能把话说得很在理却没顾上对方的处境，事后才察觉气氛变了。"

# 19.3 四步决策法：顺序固定为 感觉 → 直觉 → 思考 → 情感。
# 每一步只写「什么时候用」和「它对不习惯这一步的人该怎么做」——
# "这一步是你的主导还是辅助"由程序按类型推导，不写死在这里。
decisionSteps:
  - function: "S"
    title: "先用感觉处理事实"
    prompt: "在一个聪明、没有偏见的局外人看来，现在的处境究竟是什么状况？"
    whenUnpreferred: "这一步用不上你偏好的功能。可以先只做一件事：把能查证的事实列出来，再逐条问自己「哪一条是我以为的、而不是确认过的」。忙起来的时候，这一步最先被跳过。"

  - function: "N"
    title: "再用直觉列可能性"
    prompt: "这件事还有哪些走法？包括你原本不打算用的那些，以及别人可能会有哪些反应。"
    whenUnpreferred: "这一步用不上你偏好的功能。不必凭空想，去找两三个和你不一样的人，问他们「如果换一种做法会怎样」，把他们说的话记下来，再从里面挑。"

  - function: "T"
    title: "用思考算清后果"
    prompt: "每条路走下去会发生什么？代价、时间、对其他人的影响，以及有没有你不愿意承认的错误。"
    whenUnpreferred: "这一步用不上你偏好的功能。可以先借一个外部标准：如果换一个我佩服、但没有私交的人来评，他会怎么说？把想到的写下来，不用当场下结论。"

  - function: "F"
    title: "用情感称一称分量"
    prompt: "每条路对我在意的东西意味着什么？与这件事有关的人会怎么感受？"
    whenUnpreferred: "这一步用不上你偏好的功能。可以只做一件事：为每个方案写一句「它会让身边的人怎么样」，写完再决定哪一条的代价是值得的。"

decisionIntro: "遇到值得认真对待的问题时，按这个顺序把四个过程都用一遍：先说清事实，再列可能性，然后算后果，最后称分量。最终的决定会比只靠其中一两个过程更站得住。"
decisionNote: "作者也提醒过：这几步里，凡是要用上与你不同的人的长处的那些，一开始都很难，这很正常。问题重要时，可以直接去找有这些长处的人一起过一遍。"

# 图表 32 的口径：`offers` 只写"这一侧能提供给对面那一侧的东西"这个**内容本身**，
# 不加前缀 —— 因为同一句话在报告里有两个方向：
#   对自己用 → "你能提供给偏 X 的一侧：…"
#   对另一侧用 → "你需要偏 X 的一侧提供：…"
# 前缀由程序按方向拼，避免两侧各写一遍导致口径打架。
complements:
  - pole: "S"
    offers: "恰当的事实、合同与细节上的把关，以及把事情做完的耐心。"
  - pole: "N"
    offers: "新的可能性、把眼光放远的想象，以及带动起来的热情。"
  - pole: "T"
    offers: "把问题分析清楚，并把它组织成可以推进的样子。"
  - pole: "F"
    offers: "劝说的通达与人与人之间的调和——让一件事不只正确，还能被接受。"

# 19.5–19.6 与第 10 章的沟通规则：按你在该维的哪一侧给一条，四条一起用。
communicationRules:
  - axis: "EI"
    negative: "你需要安静下来才能缓过来这件事，别人看不出来。与其等对方理解，不如直接说一句「我接下来想安静一会儿，晚点找你」——这不是拒绝，是把需求讲清楚。"
    positive: "你想到就说、边说边想的节奏，对方可能把你正在想的东西当成已经定下来的结论。可以先补一句「我还在想，先别当最终版」。"

  - axis: "SN"
    negative: "听到一个听起来不靠谱的新想法时，先别急着说不成立。可以补一句「这个方向我手上有一条事实能加进去」——用你掌握的具体情况去补它，而不是推翻它。"
    positive: "对偏感觉的人说事，有四条具体的规矩：一开始就把你的观点说明白；把这句话说完再换话题；换话题时提醒对方；不要在不同话题之间来回跳。"

  - axis: "TF"
    negative: "要说不同意见时，先把对方话里你同意的部分说出来——「我明白你为什么这么想」。顺序换了，后面那句不同意见才进得去。另外两件事同样重要：能不说的时候就别批评；要说的缺点别夸大。"
    positive: "和偏思考的人讲事情，把理由按顺序讲清楚会更顺。同时别忘了直接说一句你的感受：对方通常不会自己看出来，你不说他就不知道。"

  - axis: "JP"
    negative: "你习惯先把事情定下来。和偏感知的人共事时，「先定方向、细节留活口」比「现在就定死」更容易一起推进；也可以直接说清哪些部分之后还能改。"
    positive: "你享受留有余地。对偏判断的人，给出一个时间点或者一个阶段性的结论，比「到时候再看」更让他们安心；这并不妨碍你之后再调整。"

# 报告里必须一起出现的三段说明。它们不是装饰：
# 没有第一段，用户会把"推导"当成"测出来的"；没有第二、三段，过程层就变成了贴标签。
notes:
  frameworkCaveat: "这一层是按四个字母、依据该框架的规则推导出来的（不是本次测量到的另一个结果）。这套框架关于「人要么偏这一侧、要么偏那一侧」的假设在学界一直有争议，重测时字母也可能变化；所以它适合用来理解自己、改善沟通，不适合用来判定一个人。"
  developmentNote: "四个过程没有高下：主导过程只是「用起来最省力」的那个，两个还没有偏好的过程也只是「还没练过」。要练的是「用得上」，不是「变成另一型」——均衡不等于两边一样多，而是各有各的位置。"
  greyAreaNote: "还没发展起来的过程不会消失：累、压力大或者放松警惕的时候，它会以不太成熟的方式冒出来——作者把这部分称为「灰色区域」。判断办法很简单：如果某次反应明显低于你平时的水准，那多半是它在起作用，不必据此给自己下结论。"

