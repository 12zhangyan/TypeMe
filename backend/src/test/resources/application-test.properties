# 全站集成测试共用的测试 profile（`@ActiveProfiles("test")`）。
#
# 只有一件事必须在这里做：**把数据源换成内存 H2**。
#
# 为什么必须显式换：`src/main/resources/application.yml` 的默认数据源指向
# 用户本机的 MySQL（`typeme_dev`）。测试若继承它，就会变成"必须有一个跑着的 MySQL
# 且迁移已经跑过"才能通过 —— 那不是单元/集成测试，那是对环境的隐式依赖，
# 而且 CI 上、别人机器上、以及"MySQL 没启动"时都会以一堆与测试主题无关的报错失败
# （实际报错是 flywayInitializer 拿不到连接，指向的却是 AdminController）。
#
# 用 H2 的 MODE=MySQL 而不是真 MySQL：迁移脚本本来就要求同时兼容两者
# （见 docs/2026-09-16/implementation/_contracts/02-数据模型与API-v1.md），
# 测试跑 H2 顺带就是在持续验证这条兼容性要求。
#
# 每个测试类用独立的库名（不要全站共用一个 mem 库）：`DB_CLOSE_DELAY=-1` 会让内存库
# 在连接关闭后继续存活到 JVM 结束，共用一个库名时不同测试类的数据会互相污染，
# 表现是"单独跑绿、一起跑红"。
#
# 库名再带一个 `${typeme.test.h2.run-id}` 后缀：该值由 com.typeme.testsupport.H2TestDatabases
# 的静态初始化块按"本次 JVM"写入系统属性。没有它的话，同一次 Maven 会话里的**第二遍**
# `mvn test` 会看到第一遍留下的数据（Maven 默认让所有测试跑在同一个 JVM 里），
# 表现为"第一次跑绿、紧接着再跑就红"。回落值 `local` 只在没加载该帮助类时用到。
spring.datasource.url=jdbc:h2:mem:typeme_test_${typeme.test.h2.run-id:local};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# 后台任务（注销清理、AI worker）在测试里不按自己的时钟跑：
# 相关用例显式调用 processPendingNow() 之类的方法驱动，断言才不会依赖调度时机。
# 不关掉的话，随机红的来源就多了一个。
typeme.deletion.worker-initial-delay=PT1H
typeme.deletion.worker-interval=PT1H

# 管理员初始账号不在测试里自动建：需要它的用例自己显式建，
# 避免"某个测试因为别人建了 admin 而通过"这种耦合。
typeme.admin.bootstrap-username=

# PBKDF2 迭代次数调低：真实值在测试里会让数十次注册/登录慢到不可接受。
# 生产默认值不受影响（本文件只在测试 classpath 上）。
typeme.auth.pbkdf2-iterations=1000

# 设置加密密钥：读写后台 AI 设置的 apiKey 需要它。
# 这是**测试用**固定值，不是任何真实环境的密钥。
typeme.security.settings-secret=test-settings-secret-0123456789
