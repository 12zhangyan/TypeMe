typeme.ai.enabled=true
typeme.ai.mock-mode=true
# 测试用假 key：只为让 enabled+key 判定通过，绝不会被真实 HTTP 客户端使用（mock-mode=true）。
# 真实 key 只能来自环境变量 DEEPSEEK_API_KEY，这里刻意写一个明显的占位值。
typeme.ai.api-key=test-key-not-a-real-secret
typeme.ai.base-url=https://api.deepseek.com
typeme.ai.model=deepseek-flash
typeme.ai.prompt-version=typeme-ai-prompt-v2
typeme.ai.connect-timeout=5s
typeme.ai.request-deadline=90s
typeme.ai.max-tokens=2600
typeme.ai.temperature=0.4
typeme.ai.daily-limit-per-user=2
typeme.ai.retry-limit-per-hour=3
typeme.ai.global-daily-token-budget=200000
typeme.ai.global-daily-call-budget=200
typeme.ai.worker-concurrency=2
# 调度间隔拉到一天（毫秒）：AI 测试自己手动驱动 worker，避免后台线程与断言抢时序（flaky 的经典来源）。
typeme.ai.worker-poll-interval-ms=86400000
typeme.ai.worker-poll-interval=86400s
typeme.ai.lease-duration=120s

# 库名带 ${typeme.test.h2.run-id} 后缀：该值由 com.typeme.testsupport.H2TestDatabases
# 的静态初始化块按"本次 JVM"写入系统属性。原因是 DB_CLOSE_DELAY=-1 会让内存库
# 活到 JVM 结束，固定库名时同一次会话里的第二遍 `mvn test` 会看到上一遍的残留数据
# （表现为"第一次跑绿、紧接着再跑就红"）。回落值 `local` 只在没加载该帮助类时用到。
spring.datasource.url=jdbc:h2:mem:typeme_ai_test_${typeme.test.h2.run-id:local};MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
# 默认跑**真实迁移**（AI 的 V4/V7 必须在 H2 的 MySQL 兼容模式下可执行，这是硬要求）。
# 唯一用途明确的逃生口：别的模块的迁移临时破坏 H2 兼容性时（例如列上出现 CHARACTER SET/COLLATE，
# H2 无论哪个位置都解析不了），AI 自己的测试仍要能跑起来给证据。设置
# TYPEME_AI_TEST_FLYWAY_LOCATIONS 指向一份修正副本即可，默认值不变 = 不掩盖问题。
spring.flyway.locations=${TYPEME_AI_TEST_FLYWAY_LOCATIONS:classpath:db/migration}
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# AI 测试只需要 JDBC/Flyway/事务/Web MVC。Security 与 Actuator 的安全链在并行开发期
# 互相牵扯（缺 HttpSecurity → managementSecurityFilterChain 建不出来），
# 而 AI 的鉴权完全在自己的控制器里（读 principal 的 getUserId()），不依赖过滤器链。
# 用属性排除而不是注解 exclude：不编译期依赖这些类，别人改动自动配置也不会让 AI 测试编译失败。
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
