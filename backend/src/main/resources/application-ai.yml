# application-ai.yml —— 「AI 侧」配置示例（可作为 profile 叠加，也可以把 typeme.ai 段直接放进你的部署配置）。
#
# 要点（契约 03 §1）：
#   * 默认值照抄契约；**不含任何真实 secret**。
#   * 取值优先级：数据库 typeme_ai_setting（管理员后台，改完无需重启） > 本文件/环境变量 > DEEPSEEK_API_KEY。
#   * base-url 只允许来自部署配置，绝不接受任何用户输入（防 SSRF）。
#   * mock-mode=true 只在开发/测试使用：响应带 mock=true，UI 必须显示"演示数据（未调用真实 DeepSeek）"。
#
# 启动示例：
#   set DEEPSEEK_API_KEY=sk-xxxx
#   java -jar typeme-backend.jar --spring.profiles.active=ai

typeme:
  ai:
    # 总开关；false 时创建接口返回 503 AI_NOT_CONFIGURED（不会生成半成品任务）。
    enabled: true
    # 只来自部署配置；不得出现在前端、也不得被请求参数覆盖。
    base-url: https://api.deepseek.com
    # 只从环境变量读；本文件永远留空。留空且 enabled=true 时：启动打 WARN，创建接口 503。
    api-key: ${DEEPSEEK_API_KEY:}
    # 模型名必须可配置；是否可用以账号实际 GET /models 与一次低成本实调为准。
    model: deepseek-flash
    # 入库、进去重键（request_hash 的一部分）。v1 文件仍保留在仓库里：历史任务按自己入库的版本解析。
    prompt-version: typeme-ai-prompt-v3
    connect-timeout: 5s
    # 单次总 deadline；部署侧（网关/Nginx）超时必须 >= 它，否则调用会先被网关掐断。
    request-deadline: 90s
    # 保留旧任务的输出预算；v3 正文编辑目标为 250–450 字，不凑字数。
    max-tokens: 2600
    temperature: 0.4
    daily-limit-per-user: 2
    retry-limit-per-hour: 3
    global-daily-token-budget: 200000
    global-daily-call-budget: 200
    worker-concurrency: 2
    # 人类可读写法（契约键，供设置页/文档）。
    worker-poll-interval: 2s
    # @Scheduled 只吃长整数：这个毫秒值才是真正生效的扫描间隔（与上一行同义冗余）。
    worker-poll-interval-ms: 2000
    # 必须 > request-deadline，否则 lease 会在上游还没返回时就过期。
    lease-duration: 120s
    # 未配置价格时**不估算费用**，只记 token 与实际调用数（绝不编造金额）。
    # usage-prices: '{"inputCacheHitMicrosPerToken":0,"inputCacheMissMicrosPerToken":0,"outputMicrosPerToken":0,"updatedAt":"2026-09-16"}'
    mock-mode: false
