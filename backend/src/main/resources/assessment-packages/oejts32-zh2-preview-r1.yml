  undeterminedTitle: "本次回答没有显示明确方向"
  undeterminedSubtitle: "四个维度都落在接近中点的范围，本次不生成完整类型。"
  insufficientTitle: "这次先保留未定"
  insufficientSubtitle: "有维度缺少足够的有效作答，本次不计算这些维度的分数。"
