  - "在工作、学习和与家人朋友相处等不同情境里分别留意自己的选择，比较哪些表现稳定、哪些随情境变化。"
  - "隔两三周再回看这次回答，比较各维度的方向是否一致；有变化是常见现象，可以继续观察。"
