  questions:
    - id: 1
      textLeft: "倾向把要做的事列成清单"
      textRight: "倾向靠记忆记住要做的事"
      dimension: "JP"
      direction: 1
    - id: 2
      textLeft: "通常先持怀疑态度"
      textRight: "通常愿意先相信"
      dimension: "TF"
      direction: -1
    - id: 3
      textLeft: "独处时容易感到无聊"
      textRight: "觉得自己需要独处时间"
      dimension: "EI"
      direction: -1
    - id: 4
      textLeft: "较容易接受事情目前的样子"
      textRight: "常觉得事情目前的样子还不能让我满意"
      dimension: "SN"
      direction: 1
    - id: 5
      textLeft: "通常把自己的房间保持整洁"
      textRight: "通常把东西随手放在方便的位置"
      dimension: "JP"
      direction: 1
    - id: 6
      textLeft: "觉得被说“像机器人”是一种负面评价"
      textRight: "希望自己的头脑能像机器那样运作"
      dimension: "TF"
      direction: 1
    - id: 7
      textLeft: "通常精力充沛"
      textRight: "通常平和沉静"
      dimension: "EI"
      direction: -1
    - id: 8
      textLeft: "更愿意回答选择题"
      textRight: "更愿意回答需要展开说明的论述题"
      dimension: "SN"
      direction: 1
    - id: 9
      textLeft: "做事或安排比较随性、零散"
      textRight: "做事或安排比较有条理"
      dimension: "JP"
      direction: -1
    - id: 10
      textLeft: "容易因别人的话受到伤害"
      textRight: "不容易因别人的话受到伤害"
      dimension: "TF"
      direction: 1
    - id: 11
      textLeft: "与别人一起做事时，通常发挥更好"
      textRight: "自己独立做事时，通常发挥更好"
      dimension: "EI"
      direction: -1
    - id: 12
      textLeft: "注意力更常放在当下"
      textRight: "注意力更常放在未来"
      dimension: "SN"
      direction: 1
    - id: 13
      textLeft: "提前较长时间做计划"
      textRight: "接近事情发生时再做计划"
      dimension: "JP"
      direction: 1
    - id: 14
      textLeft: "更希望别人尊重我"
      textRight: "更希望别人喜欢我"
      dimension: "TF"
      direction: -1
    - id: 15
      textLeft: "参加聚会后，通常感到精力被消耗"
      textRight: "参加聚会后，通常感觉更有精神"
      dimension: "EI"
      direction: 1
    - id: 16
      textLeft: "通常容易融入周围的人"
      textRight: "通常显得与周围的人不同"
      dimension: "SN"
      direction: 1
    - id: 17
      textLeft: "倾向继续保留可选的方案"
      textRight: "倾向选定方案并确定下来"
      dimension: "JP"
      direction: -1
    - id: 18
      textLeft: "更希望擅长修理物品"
      textRight: "更希望擅长帮助别人处理他们遇到的问题"
      dimension: "TF"
      direction: -1
    - id: 19
      textLeft: "与别人交流时，我通常说得更多"
      textRight: "与别人交流时，我通常听得更多"
      dimension: "EI"
      direction: -1
    - id: 20
      textLeft: "讲述一件事时，更侧重发生的经过"
      textRight: "讲述一件事时，更侧重这件事的含义"
      dimension: "SN"
      direction: 1
    - id: 21
      textLeft: "有事情要做时，通常尽快完成"
      textRight: "有事情要做时，通常会往后拖"
      dimension: "JP"
      direction: 1
    - id: 22
      textLeft: "做决定时，更跟随内心感受"
      textRight: "做决定时，更跟随理性分析"
      dimension: "TF"
      direction: 1
    - id: 23
      textLeft: "通常更愿意待在家里"
      textRight: "通常更愿意出门活动"
      dimension: "EI"
      direction: 1
    - id: 24
      textLeft: "更想先了解整体情况"
      textRight: "更想先了解具体细节"
      dimension: "SN"
      direction: -1
    - id: 25
      textLeft: "通常倾向到现场再作应对"
      textRight: "通常倾向事先做好准备"
      dimension: "JP"
      direction: -1
    - id: 26
      textLeft: "判断一件事是否合宜时，更重视公平原则"
      textRight: "判断一件事是否合宜时，更重视对人的体谅"
      dimension: "TF"
      direction: -1
    - id: 27
      textLeft: "我觉得很难大声喊话"
      textRight: "对远处的人大声喊话，我觉得很自然"
      dimension: "EI"
      direction: 1
    - id: 28
      textLeft: "更偏重理论解释"
      textRight: "更偏重观察到的事实和实际证据"
      dimension: "SN"
